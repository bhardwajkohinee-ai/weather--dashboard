<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <div class="container">

        <h1><i class="fa-solid fa-cloud-sun"></i> Weather Dashboard</h1>

        <!-- Search -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search City...">
            <button id="searchBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <!-- Weather Card -->
        <div class="weather-card">

            <div class="weather-icon">
                <i id="weatherIcon" class="fa-solid fa-sun"></i>
            </div>

            <h2 id="cityName">Delhi</h2>

            <h3 id="temperature">38°C</h3>

            <p id="condition">Sunny</p>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
